<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SmartAI Recommender</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --surface2: #1a1a26;
  --surface3: #22223a;
  --accent: #7c6af7;
  --accent2: #f7706a;
  --accent3: #6af7c8;
  --text: #f0eff8;
  --text2: #a09cb8;
  --text3: #5e5a78;
  --border: #2a2840;
  --card-bg: #14141f;
  --glow: rgba(124,106,247,0.15);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

h1,h2,h3,h4 { font-family: 'Syne', sans-serif; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

/* ── Noise overlay ── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 1000; opacity: 0.6;
}

/* ── Ambient glow blobs ── */
.blob {
  position: fixed; border-radius: 50%;
  filter: blur(80px); opacity: 0.12;
  pointer-events: none; z-index: 0;
  animation: blob-drift 8s ease-in-out infinite alternate;
}
.blob-1 { width:500px; height:500px; background:var(--accent); top:-100px; right:-100px; }
.blob-2 { width:400px; height:400px; background:var(--accent2); bottom:-100px; left:-100px; animation-delay:-3s; }
.blob-3 { width:300px; height:300px; background:var(--accent3); top:50%; left:40%; animation-delay:-5s; }
@keyframes blob-drift { to { transform: translate(30px, 20px) scale(1.1); } }

/* ── App wrapper ── */
#app { position: relative; z-index: 1; }

/* ── Nav ── */
nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 40px;
  border-bottom: 1px solid var(--border);
  background: rgba(10,10,15,0.8);
  backdrop-filter: blur(20px);
  position: sticky; top: 0; z-index: 100;
}
.logo {
  font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.4rem;
  background: linear-gradient(135deg, var(--accent), var(--accent3));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing: -0.5px;
}
.logo span { color: var(--accent2); -webkit-text-fill-color: var(--accent2); }
.nav-pills { display:flex; gap:8px; }
.pill {
  padding: 6px 18px; border-radius: 20px; font-size: 0.82rem; font-weight: 500;
  background: transparent; border: 1px solid var(--border); color: var(--text2);
  cursor: pointer; transition: all 0.2s;
}
.pill:hover, .pill.active {
  background: var(--accent); border-color: var(--accent); color: #fff;
}

/* ── Hero ── */
.hero {
  padding: 100px 40px 60px;
  text-align: center;
  max-width: 800px; margin: 0 auto;
}
.hero-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 20px;
  border: 1px solid rgba(124,106,247,0.3);
  background: rgba(124,106,247,0.08);
  color: var(--accent); font-size: 0.78rem; font-weight: 500;
  margin-bottom: 24px; letter-spacing: 0.5px;
}
.hero h1 {
  font-size: clamp(2.5rem, 6vw, 4.5rem);
  font-weight: 800; line-height: 1.05;
  letter-spacing: -2px;
  background: linear-gradient(160deg, var(--text) 40%, var(--accent) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 16px;
}
.hero p {
  color: var(--text2); font-size: 1.1rem; line-height: 1.7;
  max-width: 560px; margin: 0 auto 36px;
}
.cta-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.btn-primary {
  padding: 14px 32px; border-radius: 30px; font-weight: 600; font-size: 0.95rem;
  background: linear-gradient(135deg, var(--accent), #5a4fd9);
  border: none; color: #fff; cursor: pointer;
  box-shadow: 0 0 30px rgba(124,106,247,0.4);
  transition: all 0.3s; font-family: 'DM Sans', sans-serif;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 50px rgba(124,106,247,0.6); }
.btn-secondary {
  padding: 14px 32px; border-radius: 30px; font-weight: 600; font-size: 0.95rem;
  background: transparent; border: 1px solid var(--border); color: var(--text2);
  cursor: pointer; transition: all 0.2s; font-family: 'DM Sans', sans-serif;
}
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

/* ── Stats bar ── */
.stats-bar {
  display: flex; justify-content: center; gap: 48px;
  padding: 24px 40px;
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.stat { text-align: center; }
.stat-num { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 800; color: var(--accent); }
.stat-label { font-size: 0.75rem; color: var(--text3); letter-spacing: 0.5px; margin-top: 2px; }

/* ── Dashboard ── */
.dashboard { padding: 40px; max-width: 1280px; margin: 0 auto; }
.section-title {
  font-family: 'Syne', sans-serif; font-size: 1.4rem; font-weight: 700;
  margin-bottom: 20px; color: var(--text);
}
.section-title span { color: var(--accent); }

/* ── Control panel ── */
.control-panel {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 20px; padding: 28px;
  margin-bottom: 32px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
}
@media(max-width:700px){ .control-panel { grid-template-columns: 1fr; } }

.form-group { display: flex; flex-direction: column; gap: 8px; }
.form-label { font-size: 0.78rem; font-weight: 600; color: var(--text3); letter-spacing: 0.8px; text-transform: uppercase; }
.form-input {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); padding: 12px 16px; border-radius: 12px;
  font-size: 0.95rem; font-family: 'DM Sans', sans-serif;
  outline: none; transition: border-color 0.2s;
}
.form-input:focus { border-color: var(--accent); }

/* ── Category chips ── */
.chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 7px 16px; border-radius: 20px; font-size: 0.8rem; font-weight: 500;
  border: 1px solid var(--border); background: transparent; color: var(--text2);
  cursor: pointer; transition: all 0.2s;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.selected { background: rgba(124,106,247,0.15); border-color: var(--accent); color: var(--accent); }

/* ── Action row ── */
.action-row { display: flex; gap: 12px; align-items: flex-end; }
.btn-go {
  flex: 1; padding: 13px; border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), #5a4fd9);
  border: none; color: #fff; font-weight: 600; font-size: 0.95rem;
  cursor: pointer; transition: all 0.3s; font-family: 'DM Sans', sans-serif;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-go:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(124,106,247,0.4); }
.btn-go:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* ── Status badge ── */
.status-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px; border-radius: 12px; font-size: 0.78rem; font-weight: 500;
}
.badge-new { background: rgba(247,112,106,0.12); color: var(--accent2); border: 1px solid rgba(247,112,106,0.2); }
.badge-active { background: rgba(106,247,200,0.1); color: var(--accent3); border: 1px solid rgba(106,247,200,0.2); }
.badge-hybrid { background: rgba(124,106,247,0.12); color: var(--accent); border: 1px solid rgba(124,106,247,0.2); }

/* ── Grid ── */
.product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }

/* ── Product card ── */
.product-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 16px; overflow: hidden;
  transition: all 0.3s; cursor: pointer;
  position: relative;
  animation: card-in 0.4s ease both;
}
.product-card:hover {
  transform: translateY(-4px);
  border-color: rgba(124,106,247,0.4);
  box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 20px var(--glow);
}
@keyframes card-in { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }

.card-header {
  height: 140px;
  display: flex; align-items: center; justify-content: center;
  font-size: 2.5rem;
  position: relative; overflow: hidden;
}
.card-score-badge {
  position: absolute; top: 10px; right: 10px;
  background: rgba(124,106,247,0.9); color: #fff;
  font-size: 0.7rem; font-weight: 700; padding: 3px 8px; border-radius: 8px;
  font-family: 'Syne', sans-serif;
}
.card-type-badge {
  position: absolute; top: 10px; left: 10px;
  font-size: 0.65rem; font-weight: 600; padding: 3px 8px; border-radius: 8px;
}
.type-top { background: rgba(247,112,106,0.2); color: var(--accent2); border: 1px solid rgba(247,112,106,0.3); }
.type-great { background: rgba(124,106,247,0.2); color: var(--accent); border: 1px solid rgba(124,106,247,0.3); }
.type-explore { background: rgba(106,247,200,0.15); color: var(--accent3); border: 1px solid rgba(106,247,200,0.2); }
.type-trending { background: rgba(247,200,106,0.15); color: #f7c86a; border: 1px solid rgba(247,200,106,0.2); }

.card-body { padding: 14px 16px 16px; }
.card-brand { font-size: 0.7rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; }
.card-name { font-weight: 600; font-size: 0.88rem; line-height: 1.35; color: var(--text); margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-cat { font-size: 0.72rem; color: var(--accent); background: rgba(124,106,247,0.1); padding: 2px 8px; border-radius: 6px; display: inline-block; margin-bottom: 10px; }
.card-price-row { display: flex; align-items: center; gap: 8px; }
.card-price { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem; }
.card-mrp { font-size: 0.75rem; color: var(--text3); text-decoration: line-through; }
.card-discount { font-size: 0.72rem; color: var(--accent3); font-weight: 600; }
.card-explain { font-size: 0.72rem; color: var(--text2); line-height: 1.45; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.card-actions { display: flex; gap: 8px; margin-top: 12px; }
.btn-like, .btn-dislike {
  flex: 1; padding: 7px; border-radius: 8px; font-size: 0.78rem; font-weight: 500;
  border: 1px solid var(--border); background: transparent; color: var(--text2);
  cursor: pointer; transition: all 0.2s; font-family: 'DM Sans', sans-serif;
}
.btn-like:hover { border-color: var(--accent3); color: var(--accent3); background: rgba(106,247,200,0.06); }
.btn-dislike:hover { border-color: var(--accent2); color: var(--accent2); background: rgba(247,112,106,0.06); }
.btn-like.voted { border-color: var(--accent3); color: var(--accent3); background: rgba(106,247,200,0.1); }
.btn-dislike.voted { border-color: var(--accent2); color: var(--accent2); background: rgba(247,112,106,0.1); }

/* ── Insights panel ── */
.insights-panel {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 20px; padding: 24px; margin-bottom: 32px;
}
.insights-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-top: 16px; }
.insight-card {
  background: var(--surface2); border-radius: 12px; padding: 16px;
  border: 1px solid var(--border);
}
.insight-label { font-size: 0.7rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.6px; }
.insight-value { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.5rem; color: var(--accent); margin-top: 4px; }
.insight-sub { font-size: 0.75rem; color: var(--text2); margin-top: 2px; }

/* ── Category bar chart ── */
.cat-bar-row { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.cat-bar-item { display: flex; align-items: center; gap: 10px; }
.cat-bar-label { font-size: 0.72rem; color: var(--text2); width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat-bar-track { flex: 1; height: 6px; background: var(--surface3); border-radius: 3px; overflow: hidden; }
.cat-bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent3)); transition: width 0.8s ease; }
.cat-bar-count { font-size: 0.7rem; color: var(--text3); width: 20px; text-align: right; }

/* ── Skeleton loader ── */
.skeleton { background: linear-gradient(90deg, var(--surface2) 25%, var(--surface3) 50%, var(--surface2) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
.skeleton-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
.skel-img { height: 140px; }
.skel-body { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.skel-line { height: 10px; }
.skel-short { width: 60%; }

/* ── Empty state ── */
.empty-state { text-align: center; padding: 60px 20px; }
.empty-icon { font-size: 3rem; margin-bottom: 16px; }
.empty-title { font-family: 'Syne', sans-serif; font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; }
.empty-sub { color: var(--text2); font-size: 0.9rem; }

/* ── Section divider ── */
.divider { height: 1px; background: var(--border); margin: 32px 0; }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 18px;
  font-size: 0.85rem; color: var(--text);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  z-index: 999; animation: toast-in 0.3s ease;
}
@keyframes toast-in { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }

/* ── Tabs ── */
.tab-row { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
.tab {
  padding: 10px 22px; font-size: 0.88rem; font-weight: 500; color: var(--text3);
  border: none; background: transparent; cursor: pointer; transition: all 0.2s;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  font-family: 'DM Sans', sans-serif;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ── Loading spinner ── */
.spinner {
  width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.2);
  border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite;
}
@keyframes spin { to{ transform: rotate(360deg); } }

/* ── Responsive ── */
@media(max-width: 600px) {
  nav { padding: 14px 20px; }
  .hero { padding: 60px 20px 40px; }
  .dashboard { padding: 20px; }
  .stats-bar { gap: 24px; flex-wrap: wrap; }
}
</style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div id="app"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// ── API Service ────────────────────────────────────────────────────────────────
const API_BASE = "http://localhost:5000/api";
const api = {
  health: () => fetch(`${API_BASE}/health`).then(r => r.json()),
  trending: () => fetch(`${API_BASE}/trending`).then(r => r.json()),
  categories: () => fetch(`${API_BASE}/categories`).then(r => r.json()),
  users: () => fetch(`${API_BASE}/users`).then(r => r.json()),
  recommend: (userId, preferences, topN = 12) =>
    fetch(`${API_BASE}/recommend`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: userId, top_n: topN, preferences })
    }).then(r => r.json()),
  insights: (userId) => fetch(`${API_BASE}/insights/${userId}`).then(r => r.json()),
  feedback: (userId, productId, action) =>
    fetch(`${API_BASE}/feedback`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: userId, product_id: productId, action })
    }).then(r => r.json()),
};

// ── Category emoji map ────────────────────────────────────────────────────────
const CAT_EMOJI = {
  "Fragrance-Women": "🌸", "Westernwear-Women": "👗", "Indianwear-Women": "🥻",
  "Lingerie&Nightwear-Women": "🌙", "Jewellery-Women": "💎",
  "Footwear-Women": "👠", "Watches-Women": "⌚",
};
const getCatEmoji = (cat) => {
  for (const [k,v] of Object.entries(CAT_EMOJI)) if (cat?.includes(k.split("-")[0])) return v;
  return "🛍️";
};
const CAT_COLORS = {
  "Fragrance-Women": "#f7a6d0", "Westernwear-Women": "#a6bff7",
  "Indianwear-Women": "#f7d4a6", "Lingerie&Nightwear-Women": "#c4a6f7",
  "Jewellery-Women": "#f7e6a6", "Footwear-Women": "#a6f7d4", "Watches-Women": "#a6e4f7"
};

// ── Mock mode (when backend is not running) ───────────────────────────────────
const MOCK_PRODUCTS = [
  { product_id:"FR001", product_name:"Floral Dream Eau de Parfum 100ml", brand:"4711", category:"Fragrance-Women", price:3120, mrp:3900, discount:"20% off", score:0.91, explanation:"🔥 Trending: This Fragrance product is popular among shoppers with 20% off!", method:"hybrid", recommendation_type:"Top Pick" },
  { product_id:"DRW1", product_name:"Floral Print Wrap Dress", brand:"109f", category:"Westernwear-Women", price:569, mrp:1899, discount:"70% off", score:0.84, explanation:"⭐ Top Pick: Users with similar taste to you highly rated products from 109f.", method:"hybrid", recommendation_type:"Top Pick" },
  { product_id:"JW1", product_name:"Pearl Drop Earrings Gold Plated", brand:"accessorize", category:"Jewellery-Women", price:849, mrp:1699, discount:"50% off", score:0.77, explanation:"💡 Smart Match: Based on products you've viewed, this Jewellery item matches your style.", method:"hybrid", recommendation_type:"Great Match" },
  { product_id:"FW1", product_name:"Block Heel Ankle Strap Sandals", brand:"adidas", category:"Footwear-Women", price:1299, mrp:2599, discount:"50% off", score:0.72, explanation:"⭐ Top Pick: Users with similar taste to you rated Footwear from adidas highly.", method:"hybrid", recommendation_type:"Great Match" },
  { product_id:"WA1", product_name:"Rose Gold Dial Leather Strap Watch", brand:"alexandre christie", category:"Watches-Women", price:2299, mrp:4999, discount:"54% off", score:0.68, explanation:"💡 Smart Match: This Watches item matches your browsing history.", method:"hybrid", recommendation_type:"Great Match" },
  { product_id:"IW1", product_name:"Banarasi Silk Saree Blue", brand:"allen solly", category:"Indianwear-Women", price:4599, mrp:8999, discount:"49% off", score:0.61, explanation:"✨ You Might Like: Discover allen solly — a popular brand in Indianwear.", method:"hybrid", recommendation_type:"Explore" },
  { product_id:"LN1", product_name:"Lace Trim Satin Sleep Set", brand:"altlife", category:"Lingerie&Nightwear-Women", price:749, mrp:1499, discount:"50% off", score:0.58, explanation:"🔥 Trending: Popular among shoppers this week!", method:"hybrid", recommendation_type:"Explore" },
  { product_id:"FR2", product_name:"Rose Oud Intense Perfume 50ml", brand:"ajmal", category:"Fragrance-Women", price:1890, mrp:2700, discount:"30% off", score:0.54, explanation:"✨ You Might Like: Rose Oud is trending in Fragrance.", method:"hybrid", recommendation_type:"Explore" },
];

// ── SkeletonCard ──────────────────────────────────────────────────────────────
function SkeletonCard() {
  return (
    <div className="skeleton-card">
      <div className="skel-img skeleton"/>
      <div className="skel-body">
        <div className="skel-line skeleton skel-short"/>
        <div className="skel-line skeleton"/>
        <div className="skel-line skeleton skel-short"/>
        <div className="skel-line skeleton" style={{height:"20px"}}/>
      </div>
    </div>
  );
}

// ── ProductCard ───────────────────────────────────────────────────────────────
function ProductCard({ product, onFeedback, userId, delay = 0 }) {
  const [vote, setVote] = useState(null);
  const typeClass = { "Top Pick":"type-top", "Great Match":"type-great", "Explore":"type-explore", "Trending":"type-trending" };

  const handleVote = (action) => {
    setVote(action);
    if (onFeedback) onFeedback(product.product_id, action);
  };

  const hue = product.category ? (product.category.length * 37 % 360) : 240;
  const bg = `hsl(${hue}, 20%, 10%)`;

  return (
    <div className="product-card" style={{ animationDelay: `${delay}ms` }}>
      <div className="card-header" style={{ background: bg }}>
        <span>{getCatEmoji(product.category)}</span>
        <span className={`card-type-badge ${typeClass[product.recommendation_type] || "type-great"}`}>
          {product.recommendation_type}
        </span>
        <span className="card-score-badge">{(product.score * 100).toFixed(0)}%</span>
      </div>
      <div className="card-body">
        <div className="card-brand">{product.brand}</div>
        <div className="card-name">{product.product_name}</div>
        <div><span className="card-cat">{product.category?.split("-")[0]}</span></div>
        <div className="card-price-row">
          <span className="card-price">₹{product.price?.toLocaleString()}</span>
          {product.mrp > product.price && <span className="card-mrp">₹{product.mrp?.toLocaleString()}</span>}
          <span className="card-discount">{product.discount}</span>
        </div>
        <div className="card-explain">{product.explanation}</div>
        {userId && (
          <div className="card-actions">
            <button className={`btn-like ${vote==="like"?"voted":""}`} onClick={() => handleVote("like")}>
              {vote==="like" ? "✅ Liked" : "👍 Like"}
            </button>
            <button className={`btn-dislike ${vote==="dislike"?"voted":""}`} onClick={() => handleVote("dislike")}>
              {vote==="dislike" ? "❌ Disliked" : "👎 Dislike"}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// ── InsightsPanel ─────────────────────────────────────────────────────────────
function InsightsPanel({ insights }) {
  if (!insights || insights.status === "new_user") {
    return (
      <div className="insights-panel">
        <div className="section-title">📊 User <span>Insights</span></div>
        <div style={{ color: "var(--text2)", fontSize: "0.9rem" }}>
          🆕 New user detected — Showing trending products. Interact with products to unlock personalized insights!
        </div>
      </div>
    );
  }

  const cats = insights.category_distribution || {};
  const maxCount = Math.max(...Object.values(cats), 1);

  return (
    <div className="insights-panel">
      <div className="section-title">📊 User <span>Insights</span></div>
      <div className="insights-grid">
        <div className="insight-card">
          <div className="insight-label">Total Interactions</div>
          <div className="insight-value">{insights.total_interactions}</div>
          <div className="insight-sub">Products explored</div>
        </div>
        <div className="insight-card">
          <div className="insight-label">Avg Price Range</div>
          <div className="insight-value">₹{insights.average_price_range?.toLocaleString()}</div>
          <div className="insight-sub">Your typical spend</div>
        </div>
        <div className="insight-card">
          <div className="insight-label">Top Brands</div>
          <div className="insight-value" style={{ fontSize: "0.9rem", lineHeight: 1.4, marginTop: 8 }}>
            {(insights.top_brands || []).join(", ") || "—"}
          </div>
          <div className="insight-sub">Most explored</div>
        </div>
      </div>

      {Object.keys(cats).length > 0 && (
        <div style={{ marginTop: 20 }}>
          <div style={{ fontSize: "0.75rem", color: "var(--text3)", textTransform: "uppercase", letterSpacing: "0.6px", marginBottom: 10 }}>
            Category Distribution
          </div>
          <div className="cat-bar-row">
            {Object.entries(cats).sort((a,b) => b[1]-a[1]).map(([cat, count]) => (
              <div className="cat-bar-item" key={cat}>
                <div className="cat-bar-label">{getCatEmoji(cat)} {cat.split("-")[0]}</div>
                <div className="cat-bar-track">
                  <div className="cat-bar-fill" style={{ width: `${(count/maxCount)*100}%` }}/>
                </div>
                <div className="cat-bar-count">{count}</div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ── Toast ──────────────────────────────────────────────────────────────────────
function Toast({ message }) {
  return message ? <div className="toast">{message}</div> : null;
}

// ── Main App ──────────────────────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState("home");
  const [userId, setUserId] = useState("");
  const [prefs, setPrefs] = useState([]);
  const [recommendations, setRecommendations] = useState([]);
  const [trending, setTrending] = useState([]);
  const [insights, setInsights] = useState(null);
  const [categories, setCategories] = useState([]);
  const [loading, setLoading] = useState(false);
  const [toast, setToast] = useState("");
  const [activeTab, setActiveTab] = useState("for-you");
  const [backendOnline, setBackendOnline] = useState(null);
  const [validUsers, setValidUsers] = useState([]);

  // Check backend on mount
  useEffect(() => {
    api.health()
      .then(() => { setBackendOnline(true); })
      .catch(() => { setBackendOnline(false); });
    api.categories()
      .then(r => { if (r.data) setCategories(r.data); })
      .catch(() => setCategories(["Fragrance-Women","Westernwear-Women","Indianwear-Women","Jewellery-Women","Footwear-Women","Watches-Women"]));
    api.trending()
      .then(r => { if (r.data) setTrending(r.data); })
      .catch(() => setTrending(MOCK_PRODUCTS.slice(0,6)));
    api.users()
      .then(r => { if (r.data) setValidUsers(r.data.user_ids || []); })
      .catch(() => setValidUsers([1,2,3,5,10,15,20]));
  }, []);

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(""), 2500);
  };

  const togglePref = (cat) => {
    setPrefs(p => p.includes(cat) ? p.filter(c=>c!==cat) : [...p, cat]);
  };

  const handleRecommend = async () => {
    const uid = parseInt(userId);
    if (!userId) { showToast("⚠️ Please enter a User ID"); return; }
    setLoading(true);
    setPage("dashboard");

    try {
      let recs, ins;
      if (backendOnline) {
        [recs, ins] = await Promise.all([
          api.recommend(uid, prefs, 12),
          api.insights(uid),
        ]);
        setRecommendations(recs.data?.recommendations || []);
        setInsights(ins.data || null);
      } else {
        // Mock mode
        await new Promise(r => setTimeout(r, 1200));
        setRecommendations(MOCK_PRODUCTS);
        setInsights({ status:"active_user", user_id:uid, total_interactions: 14, average_price_range: 1850, top_brands:["4711","109f","accessorize"], category_distribution: { "Fragrance-Women":5, "Westernwear-Women":4, "Jewellery-Women":3, "Footwear-Women":2 } });
        showToast("🔌 Demo mode — backend offline. Showing sample data.");
      }
    } catch (e) {
      setRecommendations(MOCK_PRODUCTS);
      showToast("🔌 Demo mode active");
    }
    setLoading(false);
    showToast("✨ Recommendations ready!");
  };

  const handleFeedback = async (productId, action) => {
    if (!userId) return;
    try {
      if (backendOnline) await api.feedback(parseInt(userId), productId, action);
    } catch {}
    showToast(action === "like" ? "👍 Feedback recorded — improving your feed!" : "👎 Got it — we'll adjust your feed.");
  };

  const handleRefresh = () => {
    handleRecommend();
    showToast("🔄 Refreshing recommendations...");
  };

  // ── HOME PAGE ──────────────────────────────────────────────────────────────
  if (page === "home") return (
    <div id="app">
      <nav>
        <div className="logo">Smart<span>AI</span> Recommender</div>
        <div className="nav-pills">
          <button className="pill active" onClick={() => setPage("home")}>Home</button>
          <button className="pill" onClick={() => setPage("dashboard")}>Dashboard</button>
        </div>
      </nav>

      <div className="hero">
        <div className="hero-badge">
          <span>✨</span> AI-Powered Shopping Intelligence
          {backendOnline === true && <span style={{color:"var(--accent3)", fontSize:"0.7rem", marginLeft:4}}>● Live</span>}
          {backendOnline === false && <span style={{color:"var(--accent2)", fontSize:"0.7rem", marginLeft:4}}>● Demo</span>}
        </div>
        <h1>Shop Smarter with AI That Knows You</h1>
        <p>SmartAI Recommender uses Hybrid Machine Learning — collaborative filtering, content-based matching, and popularity signals — to surface exactly what you'll love.</p>
        <div className="cta-row">
          <button className="btn-primary" onClick={() => setPage("dashboard")}>🚀 Start Exploring</button>
          <button className="btn-secondary" onClick={() => { setPage("dashboard"); }}>📊 View Dashboard</button>
        </div>
      </div>

      <div className="stats-bar">
        <div className="stat"><div className="stat-num">4,566</div><div className="stat-label">Products Indexed</div></div>
        <div className="stat"><div className="stat-num">7</div><div className="stat-label">Categories</div></div>
        <div className="stat"><div className="stat-num">100+</div><div className="stat-label">User Profiles</div></div>
        <div className="stat"><div className="stat-num">3</div><div className="stat-label">AI Models</div></div>
      </div>

      {/* How it works */}
      <div className="dashboard" style={{paddingTop:48}}>
        <div className="section-title">🧠 How the <span>AI Works</span></div>
        <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(220px, 1fr))", gap:16, marginBottom:40}}>
          {[
            { icon:"🤝", title:"Collaborative Filtering", desc:"Finds users similar to you and recommends what they loved. Like Netflix: 'people who watched X also watched Y'." },
            { icon:"🔍", title:"Content-Based Filtering", desc:"Analyzes product features (brand, category, description) using TF-IDF + cosine similarity to find matching items." },
            { icon:"🔥", title:"Popularity Engine", desc:"Solves the cold-start problem for new users. Shows trending, high-discount, highly-rated products first." },
            { icon:"⚡", title:"Hybrid Scoring", desc:"Final Score = 50% Collaborative + 30% Content + 20% Popularity. Best of all worlds!" },
          ].map(c => (
            <div key={c.title} style={{background:"var(--card-bg)", border:"1px solid var(--border)", borderRadius:16, padding:20}}>
              <div style={{fontSize:"1.8rem", marginBottom:10}}>{c.icon}</div>
              <div style={{fontFamily:"Syne", fontWeight:700, fontSize:"0.95rem", marginBottom:8}}>{c.title}</div>
              <div style={{color:"var(--text2)", fontSize:"0.8rem", lineHeight:1.6}}>{c.desc}</div>
            </div>
          ))}
        </div>

        {/* Trending preview */}
        {trending.length > 0 && (
          <>
            <div className="section-title">🔥 <span>Trending Now</span></div>
            <div className="product-grid">
              {trending.slice(0,4).map((p,i) => (
                <ProductCard key={p.product_id} product={p} delay={i*60}/>
              ))}
            </div>
          </>
        )}
      </div>
      <Toast message={toast}/>
    </div>
  );

  // ── DASHBOARD PAGE ─────────────────────────────────────────────────────────
  return (
    <div id="app">
      <nav>
        <div className="logo">Smart<span>AI</span> Recommender</div>
        <div className="nav-pills">
          <button className="pill" onClick={() => setPage("home")}>Home</button>
          <button className="pill active">Dashboard</button>
        </div>
      </nav>

      <div className="dashboard">
        {/* Control Panel */}
        <div className="section-title" style={{marginBottom:16}}>🎛️ Recommendation <span>Engine</span></div>
        <div className="control-panel">
          <div>
            <div className="form-group">
              <label className="form-label">User ID</label>
              <input
                className="form-input"
                type="number"
                placeholder="Enter User ID (e.g. 1–100)"
                value={userId}
                onChange={e => setUserId(e.target.value)}
                onKeyDown={e => e.key === "Enter" && handleRecommend()}
              />
              <div style={{fontSize:"0.72rem", color:"var(--text3)", marginTop:4}}>
                Try IDs: {validUsers.slice(0,5).join(", ")} · New user? Use any number &gt; 100
              </div>
            </div>

            <div style={{marginTop:16}}>
              <div className="form-label" style={{marginBottom:8}}>Filter by Category</div>
              <div className="chip-group">
                {categories.map(cat => (
                  <button key={cat} className={`chip ${prefs.includes(cat)?"selected":""}`} onClick={() => togglePref(cat)}>
                    {getCatEmoji(cat)} {cat.split("-")[0]}
                  </button>
                ))}
              </div>
            </div>
          </div>

          <div style={{display:"flex", flexDirection:"column", gap:12}}>
            <div className="form-group" style={{flex:1}}>
              <label className="form-label">Recommendation Method</label>
              <div style={{background:"var(--surface2)", border:"1px solid var(--border)", borderRadius:12, padding:14}}>
                <div style={{fontSize:"0.8rem", color:"var(--text2)", lineHeight:1.7}}>
                  <span style={{color:"var(--accent)", fontWeight:600}}>Hybrid AI</span> — Combines:<br/>
                  &nbsp;• 50% Collaborative Filtering<br/>
                  &nbsp;• 30% Content-Based Filtering<br/>
                  &nbsp;• 20% Popularity Score
                </div>
              </div>
            </div>
            <div className="action-row">
              <button className="btn-go" onClick={handleRecommend} disabled={loading}>
                {loading ? <><div className="spinner"/>&nbsp;Analyzing...</> : "✨ Get Recommendations"}
              </button>
              {recommendations.length > 0 && (
                <button className="btn-go" style={{flex:0, padding:"13px 16px", background:"var(--surface2)", border:"1px solid var(--border)"}} onClick={handleRefresh} title="Smart Refresh">
                  🔄
                </button>
              )}
            </div>
          </div>
        </div>

        {/* Insights */}
        {insights && <InsightsPanel insights={insights}/>}

        {/* Tabs */}
        {(loading || recommendations.length > 0 || trending.length > 0) && (
          <div className="tab-row">
            <button className={`tab ${activeTab==="for-you"?"active":""}`} onClick={() => setActiveTab("for-you")}>
              ✨ For You {recommendations.length > 0 && `(${recommendations.length})`}
            </button>
            <button className={`tab ${activeTab==="trending"?"active":""}`} onClick={() => setActiveTab("trending")}>
              🔥 Trending ({trending.length})
            </button>
          </div>
        )}

        {/* Product Grid */}
        {loading ? (
          <div className="product-grid">
            {Array.from({length:8}).map((_,i) => <SkeletonCard key={i}/>)}
          </div>
        ) : activeTab === "for-you" ? (
          recommendations.length > 0 ? (
            <>
              <div style={{display:"flex", alignItems:"center", gap:12, marginBottom:20}}>
                <div style={{fontSize:"0.85rem", color:"var(--text2)"}}>
                  Showing <strong style={{color:"var(--text)"}}>{recommendations.length}</strong> personalized picks for User <strong style={{color:"var(--accent)"}}>{userId}</strong>
                </div>
                {recommendations[0]?.method && (
                  <span className={`status-badge ${recommendations[0].method==="popularity"?"badge-new":recommendations[0].method==="hybrid"?"badge-hybrid":"badge-active"}`}>
                    {recommendations[0].method === "popularity" ? "🆕 New User — Popularity Mode" : "🧠 Hybrid AI Active"}
                  </span>
                )}
              </div>
              <div className="product-grid">
                {recommendations.map((p, i) => (
                  <ProductCard key={p.product_id} product={p} onFeedback={handleFeedback} userId={userId} delay={i*50}/>
                ))}
              </div>
            </>
          ) : (
            <div className="empty-state">
              <div className="empty-icon">🤖</div>
              <div className="empty-title">Ready to recommend</div>
              <div className="empty-sub">Enter a User ID above and click "Get Recommendations"</div>
            </div>
          )
        ) : (
          <div className="product-grid">
            {trending.map((p, i) => (
              <ProductCard key={p.product_id} product={p} onFeedback={handleFeedback} userId={userId} delay={i*50}/>
            ))}
          </div>
        )}
      </div>

      <Toast message={toast}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App/>);
</script>
</body>
</html>
